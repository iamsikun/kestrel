[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kestrel-research-runtime"
version = "0.1.0"
description = "Evidence-first research runtime: deterministic first pilot"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6.0.2,<7"]

[project.scripts]
kestrel = "kestrel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "hypothesis>=6.140,<7", "ruff>=0.13,<1", "pytest-socket>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"
markers = ["acceptance(id): first-pilot acceptance requirement", "isolation: measured Docker tests requiring explicit invocation", "install: clean external wheel installation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
